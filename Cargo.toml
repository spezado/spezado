# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/spezado/spezado"
publish = false

[workspace.dependencies]
# Each crate names its other dependencies with exact versions, each the newest that is at least 14 days old
# (scripts/check-age.py); a fix for a security advisory may be younger.
# The protocol (MIT), by its tag.
librotenado = { git = "https://github.com/librotenado/librotenado", tag = "v0.7.2" }
spezado-api = { path = "crates/spezado-api" }
spezado-app = { path = "crates/spezado-app" }
spezado-core = { path = "crates/spezado-core" }
spezado-law = { path = "crates/spezado-law" }
spezado-law-de = { path = "crates/spezado-law-de" }
spezado-relay = { path = "crates/spezado-relay" }
spezado-store = { path = "crates/spezado-store" }
spezado-tui = { path = "crates/spezado-tui" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

