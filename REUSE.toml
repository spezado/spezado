# SPDX-License-Identifier: AGPL-3.0-or-later
# Licence and copyright of files that cannot carry a header (REUSE specification 3.3). Source files name their own
# licence in an SPDX header.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the spezado contributors"

[[annotations]]
path = ["**/*.md", "**/.gitignore", ".gitattributes", "Cargo.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the spezado contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The description of the API: MIT, so that clients generated from it – like spezado/apps – can be licensed freely.
[[annotations]]
path = ["api/openapi.json", "docs/src/openapi.json"]
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the spezado contributors"
SPDX-License-Identifier = "MIT"

# Copies of the brand's artwork from spezado/brand – to be passed on unchanged; name and brand are falkOSS's.
[[annotations]]
path = ["brand/svg/**", "brand/web/**", "docs/theme/favicon.*", "web/public/*.svg"]
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G."
SPDX-License-Identifier = "CC-BY-ND-4.0"

[[annotations]]
path = ["brand/fonts/**", "brand/web/fonts/**", "docs/src/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2014, 2015 (URW)++ Design & Development", "2019-2020 Daniel Benjamin Miller"]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "crates/spezado-app/tests/data/0*.xml"
precedence = "override"
SPDX-FileCopyrightText = "Koordinierungsstelle für IT-Standards (KoSIT)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["crates/spezado-app/tests/data/statement-*.xml", "crates/spezado-app/tests/data/statement.mt940"]
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the librotenado contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["web/package.json", "web/pnpm-lock.yaml", "web/tsconfig.json", "web/src/lib/api-types.ts"]
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the spezado contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "web/public/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = ["2014, 2015 (URW)++ Design & Development", "2019-2020 Daniel Benjamin Miller"]
SPDX-License-Identifier = "OFL-1.1"
