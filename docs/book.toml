# The documentation at spezado.dev: guides to the terminal, the web app, the command line and the API, the design
# (included from docs/spec.md, not copied) and the changelog. Built by docs/build.sh.
[book]
title = "spezado"
description = "Free accounting for everyone – the documentation"
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/spezado.css"]
git-repository-url = "https://github.com/spezado/spezado"
edit-url-template = "https://github.com/spezado/spezado/edit/main/{path}"
site-url = "/"
cname = "spezado.dev"
no-section-label = true

[output.html.search]
enable = true
