# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "spezado-app"
description = "The application layer of spezado: a workspace of books, executing commands, workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
hex = "=0.4.3"
keyring = "=4.2.0"
krilla = "=0.8.2"
librotenado.workspace = true
rustybuzz = "=0.20.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
spezado-core.workspace = true
spezado-law.workspace = true
spezado-law-de.workspace = true
spezado-store.workspace = true
thiserror = "=2.0.21"
ureq = "=3.4.2"
uuid = { version = "=1.28.0", features = ["v7"] }

[dev-dependencies]
spezado-relay.workspace = true
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net"] }
serde_json = "=1.0.154"
axum = "=0.8.9"
