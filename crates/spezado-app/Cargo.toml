[package]
name = "spezado-app"
description = "The application layer of spezado: a workspace of books, executing commands, workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
krilla = "0.8.2"
librotenado.workspace = true
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spezado-core.workspace = true
spezado-law.workspace = true
spezado-law-de.workspace = true
spezado-store.workspace = true
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
serde_json = "1.0.154"
