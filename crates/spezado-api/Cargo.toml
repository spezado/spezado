# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "spezado-api"
description = "The open API of spezado: HTTP and JSON for the web app and the apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "=0.8.9"
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
futures-util = "=0.3.34"
getrandom = "=0.4.3"
hex = "=0.4.3"
librotenado.workspace = true
rcgen = "=0.14.10"
rust-embed = { version = "=8.13.0", features = ["mime-guess"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
spezado-app.workspace = true
spezado-core.workspace = true
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-stream = { version = "=0.1.19", features = ["sync"] }
utoipa = { version = "=6.0.0", features = ["axum_extras"] }
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", features = ["util"] }
