# SPDX-License-Identifier: AGPL-3.0-or-later
# A release for a tag v*: the binary with the web app embedded, built per platform, packed with the licences, and
# published as a GitHub release with checksums and the notes of CHANGELOG.md; for servers, the Linux binaries as a
# container image on ghcr.io (deploy/Dockerfile). Only the GitHub CLI and Docker of the runners are used beyond the
# actions of the CI, pinned by commit.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A draft release with the notes of this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --draft --verify-tag --title "spezado $version" --notes-file notes.md

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - name: Binary
        # With the menu bar or the system tray on macOS and Windows; on Linux it would need GTK even on servers.
        run: |
          features=$([[ "${{ matrix.target }}" == *linux* ]] && echo "" || echo "--features tray")
          cargo build --release --locked -p spezado --target ${{ matrix.target }} $features
      - name: Pack and upload, with a checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="spezado-${TAG#v}-$TARGET"
          mkdir "$name"
          cp -R LICENSE LICENSES README.md CHANGELOG.md "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/spezado.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "target/$TARGET/release/spezado" "$name/"
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          gh release upload "$TAG" "$archive" "$archive.sha256"

  image:
    needs: build
    runs-on: ubuntu-latest
    # Write: the release is still a draft, which only those who may write can see.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The Linux binaries of this release, checked against their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch="${pair%%:*}"; name="spezado-$version-${pair#*:}"
            gh release download "$TAG" --pattern "$name.tar.gz" --pattern "$name.tar.gz.sha256"
            sha256sum -c "$name.tar.gz.sha256"
            tar -xzf "$name.tar.gz"
            cp "$name/spezado" "deploy/spezado-$arch"
          done
          cp -R LICENSE LICENSES README.md deploy/
          mkdir deploy/data
      - name: Build for amd64 and arm64 and push to ghcr.io
        env:
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build deploy --platform linux/amd64,linux/arm64 --build-arg VERSION="$version" \
            --tag "$image:$version" --tag "$image:latest" --push

  publish:
    needs: [build, image]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
